<div id="filter-sheet" class="sheet sheet--filters" hidden>
  <div class="sheet__head sheet__head--filters">
    <button id="filter-back" class="icon-button" title="Back"><svg><use href="#i-back"/></svg></button>
    <b>Filters</b>
  </div>
  <p class="sheet__intro">Hide events from the feed, set minimum values, and choose colors</p>
  <div id="filter-rows"></div>
  <button id="filter-clear" class="sheet__foot">Clear All</button>
</div>
<div id="ad-menu" class="menu menu--right" hidden></div>
<div id="prefs" class="popover" hidden>
  <label class="prow"><button type="button" class="switch" data-pref="avatars"></button><span>Avatar</span></label>
  <label class="prow"><button type="button" class="switch" data-pref="readMarkers"></button><span>Show Read Markers</span></label>
  <label class="prow"><button type="button" class="switch" data-pref="labels"></button><span>Control Labels</span></label>
  <label class="prow"><button type="button" class="switch" data-pref="adControls"></button><span>Ad Controls</span></label>
  <button type="button" class="pitem" id="pref-reload">Reload Overlays</button>
  <button type="button" class="pitem" id="pref-se">StreamElements and Ads…</button>
  <button type="button" class="pitem" id="pref-demo">Show Sample Events (Here Only)</button>
  <button type="button" class="pitem" id="pref-live">Simulate Live Events (Chat + Activity)</button>
  <div class="pfont">
    <b>Size <output id="pref-font-value">100%</output></b>
    <input id="pref-font" type="range" min="70" max="200" step="5" value="100">
  </div>
  <button type="button" class="pitem pitem--danger" id="pref-reset">Reset Session</button>
</div>

<div id="settings" class="sheet" hidden>
  <div class="sheet__head"><b>Settings</b><button id="settings-close" class="icon-button" title="Close"><svg><use href="#i-close"/></svg></button></div>
  <label class="field"><span>StreamElements JWT Token</span>
    <input id="se-token" type="password" placeholder="Paste the JWT here" autocomplete="off" spellcheck="false">
    <small>Find it on your StreamElements account page: channel row → enable <i>Show Secrets</i> → copy “JWT Token”. It enables alert controls, “Replay Alert,” and your Activity Feed history. Paste it once; it does not expire soon.</small>
    <button type="button" id="se-open" class="pill pill--ghost">Open Token Page</button>
  </label>
  <label class="field"><span>Default Ad Duration</span>
    <select id="ad-length"><option value="30">30 seconds</option><option value="60">60 seconds</option><option value="90">90 seconds</option><option value="120">120 seconds</option><option value="150">150 seconds</option><option value="180">180 seconds</option></select>
  </label>
  <button id="settings-save" class="pill">Save</button>
  <div id="settings-note" class="note"></div>
</div>

<div id="toast" class="toast" hidden></div>
<ul id="list" class="list"></ul>
<div id="empty" class="empty">No activity yet. Follows, subscriptions, gifts, and raids will appear here.</div>

<script src="feed.js"></script>
</body>
