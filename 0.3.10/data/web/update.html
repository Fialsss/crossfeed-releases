<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crossfeed · Updates</title>
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="update.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chat" viewBox="0 0 24 24"><path fill="currentColor" d="M9 10h2v2H9v-2Zm6 0h-2v2h2v-2Z"/><path fill="currentColor" fill-rule="evenodd" d="m12 22-3-3H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4l-3 3Zm-2.172-5L12 19.172 14.172 17H19V5H5v12h4.828Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7"/></symbol>
</svg>

<main class="stage">
  <section class="card">
    <header class="card__head">
      <span class="mark"><svg><use href="#i-chat"/></svg></span>
      <span class="card__brand">Crossfeed</span>
      <span id="tag" class="tag" hidden></span>
    </header>

    <div class="view">
      <p id="eyebrow" class="eyebrow"></p>
      <h1 id="title"></h1>
      <p id="lead" class="lead"></p>
      <div id="notes" class="notes"></div>
    </div>

    <footer class="foot">
      <button id="releases" class="link" type="button">All releases</button>
      <div id="hint" class="hint"></div>
      <button id="later" class="btn ghost" type="button">Later</button>
      <button id="go" class="btn primary" type="button"></button>
    </footer>
  </section>
</main>

<script src="update.js"></script>
</body>
</html>
