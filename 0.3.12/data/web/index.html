<main class="chat-room">
  <header class="chat-header">
    <span class="chat-header__title">Stream Chat</span>
    <div class="counts">
      <span class="count twitch is-off" title="Twitch viewers"><svg><use href="#i-eye"/></svg><b>–</b></span>
      <span class="count tiktok is-off" title="TikTok viewers"><svg><use href="#i-eye"/></svg><b>–</b></span>
    </div>
    <button id="viewers" class="icon-button" title="Chat participants"><svg><use href="#i-people"/></svg></button>
  </header>

<iframe id="setup-frame" class="setup-frame" title="Setup Wizard" hidden></iframe>
<div class="chat-body">
  <div id="viewer-card" class="viewer-card" hidden></div>
  <section id="messages" class="chat-scrollable-area" role="log" aria-live="polite"></section>
  <div id="highlights" class="community-highlight-stack" hidden>
    <div id="highlight-sticky" class="community-highlight-stack__sticky"></div>
    <div class="community-highlight-stack__deck">
      <div id="highlight-backlog" class="community-highlight-stack__backlog-card" hidden></div>
      <div id="highlight-card" class="community-highlight-stack__card"></div>
    </div>
  </div>
  <div id="viewer-list" class="viewer-list" hidden>
    <div class="viewer-list__head">
      <button id="viewers-close" class="icon-button" title="Close"><svg><use href="#i-close"/></svg></button>
      <span>USERS IN CHAT</span>
    </div>
    <div class="viewer-list__filter">
      <svg viewBox="0 0 20 20"><path fill="currentColor" d="M9 3a6 6 0 1 0 3.7 10.7l3.3 3.3 1.4-1.4-3.3-3.3A6 6 0 0 0 9 3zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="viewers-filter" type="text" placeholder="Filter" autocomplete="off" spellcheck="false">
    </div>
    <div id="viewers-body" class="viewer-list__body"></div>
  </div>
  <button id="resume" class="resume" hidden><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 4H5v16h5V4Zm9 0h-5v16h5V4Z"/></svg><span>Chat paused due to scroll</span></button>
  </div>

  <div class="chat-input">
    <div class="above-input">
      <div id="settings" class="settings" hidden>
    <div class="settings__head">
      <span>Chat Settings</span>
      <button id="settings-close" class="icon-button" title="Close"><svg><use href="#i-close"/></svg></button>
    </div>

    <div class="settings__section">My Preferences</div>
    <label class="row"><span>Chat Style</span>
      <select id="opt-style">
        <option value="twitch">Twitch</option>
        <option value="multistream">Multistream</option>
      </select>
    </label>
    <label class="row"><span>Mod Icons</span>
      <select id="opt-modicons">
        <option value="hover">On hover</option>
        <option value="always">Always</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label class="row"><span>Show timestamps</span>
      <input type="checkbox" id="opt-time" class="switch-input" checked><span class="switch"></span>
    </label>
    <label class="row"><span>Show moderation actions</span>
      <input type="checkbox" id="opt-modactions" class="switch-input" checked><span class="switch"></span>
    </label>
    <label class="row"><span>Automatic screen reader announcements</span>
      <input type="checkbox" id="opt-aria" class="switch-input"><span class="switch"></span>
    </label>
    <label class="row"><span>Show messages held by AutoMod categories</span>
      <input type="checkbox" id="opt-automod-cat" class="switch-input" checked><span class="switch"></span>
    </label>
    <label class="row"><span>Show messages held by AutoMod</span>
      <input type="checkbox" id="opt-automod-std" class="switch-input" checked><span class="switch"></span>
    </label>
    <label class="row"><span>Show messages held for blocked channel terms</span>
      <input type="checkbox" id="opt-automod-terms" class="switch-input" checked><span class="switch"></span>
    </label>
    <label class="row"><span>Show messages held for blocked links</span>
      <input type="checkbox" id="opt-automod-links" class="switch-input" checked><span class="switch"></span>
    </label>
    <label class="row"><span>Deleted Messages</span>
      <select id="opt-deleted">
        <option value="legacy">Legacy</option>
        <option value="short">Brief</option>
        <option value="detail">Detailed</option>
        <option value="hide">Hide</option>
      </select>
    </label>
    <label class="row"><span>Pause Chat</span>
      <select id="opt-pause">
        <option value="scroll">While scrolling</option>
        <option value="hover">While hovering</option>
        <option value="never">Never</option>
      </select>
    </label>
    <button id="open-popout" class="row row--button"><span>Pop-out Chat</span><span class="link">open &#8599;</span></button>

    <div class="settings__section">Chat Appearance</div>
    <label class="row row--range"><span>Chat Size</span>
      <input type="range" id="opt-zoom" min="70" max="200" step="5" value="100">
      <output id="opt-zoom-value">100%</output>
    </label>
    <label class="row"><span>Alternating Rows</span>
      <input type="checkbox" id="opt-alternate" class="switch-input"><span class="switch"></span>
    </label>
    <label class="row"><span>Readable Name Colors</span>
      <input type="checkbox" id="opt-readable" class="switch-input" checked><span class="switch"></span>
    </label>

    <div class="settings__section">Platforms</div>
    <div class="filters">
      <button class="filter is-active" data-filter="all">All</button>
      <button class="filter" data-filter="twitch">Twitch</button>
      <button class="filter" data-filter="tiktok">TikTok</button>
    </div>
    <label class="field">Twitch Channel<input id="twitch-channel" autocomplete="off" spellcheck="false"></label>
    <label class="field">TikTok User<input id="tiktok-channel" autocomplete="off" spellcheck="false"></label>
    <button id="save" class="chat-button wide">Save and Connect</button>
    <p id="settings-result"></p>

    <div class="settings__section">Twitch Account</div>
    <p class="muted" id="account-state">Twitch account not connected.</p>
    <label class="field" id="client-id-row">Twitch Application Client ID<input id="client-id" autocomplete="off" spellcheck="false" placeholder="from dev.twitch.tv/console/apps"></label>
    <button id="connect-account" class="chat-button wide">Connect Twitch Account</button>
    <p id="device-code" hidden></p>
  </div>
      <div id="emote-panel" class="emote-panel" hidden>
    <div class="emote-search">
      <svg viewBox="0 0 20 20" class="emote-search__icon"><path fill="currentColor" d="M9 3a6 6 0 1 0 3.7 10.7l3.3 3.3 1.4-1.4-3.3-3.3A6 6 0 0 0 9 3zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="emote-search" type="text" placeholder="Search emotes" autocomplete="off" spellcheck="false">
      <button id="emote-close" title="Close"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="emote-body">
      <div id="emote-grid" class="emote-grid"></div>
      <div id="emote-rail" class="emote-rail"></div>
    </div>
    <p id="emote-state" class="muted"></p>
  </div>
      <div id="commands" class="commands" hidden></div>
      <div id="mentions" class="commands mentions" hidden></div>
      <div id="reauth" class="reauth" hidden>
      <span>New Twitch permissions are required for moderation, AutoMod, the Activity feed, and channel point rewards.</span>
      <button id="reauth-button">Reconnect</button>
    </div>
    </div>

    <div id="reply-bar" class="reply-bar" hidden>
      <div class="reply-bar__head">
        <svg><use href="#i-replyline"/></svg>
        <b id="reply-label"></b>
        <button id="reply-cancel" class="icon-button" title="Cancel Reply"><svg><use href="#i-close"/></svg></button>
      </div>
      <div id="reply-quote" class="reply-bar__quote"></div>
      <div id="thread-list" class="reply-bar__thread" hidden></div>
      <div id="reply-footer" class="reply-bar__footer" hidden>Replying to <b id="reply-footer-name"></b><span class="dot">•</span><button id="reply-footer-cancel" class="text-button" type="button">Cancel</button></div>
    </div>
    <div class="chat-input__box">
      <div id="text" contenteditable="true" role="textbox" data-placeholder="Send a message" spellcheck="false"></div>
      <button id="emotes" class="icon-in-box" title="Emote" tabindex="-1"><svg><use href="#i-smile"/></svg></button>
    </div>
    <div class="chat-input__buttons">
      <span id="dots" class="dots"></span>
      <span class="spacer"></span>
      <button id="settings-button" class="icon-button" title="Chat Settings"><svg><use href="#i-gear"/></svg></button>
      <button id="send" class="chat-button">Chat</button>
    </div>
  </div>

  <div id="context-menu" class="context-menu" hidden>
    <button data-action="delete">Delete Message</button>
    <button data-action="timeout">Timeout for 10 Minutes</button>
    <button data-action="ban">Permanent Ban</button>
  </div>
</main>

<script src="/app.js"></script>
<script src="/emotes.js"></script>
</body>
</html>
